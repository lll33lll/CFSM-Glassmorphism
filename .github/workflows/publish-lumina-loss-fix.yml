name: Publish reviewed LuminaPlus loss fix
on:
  push:
    branches: [fix/lumina-loss-20261120]
    paths: [.github/workflows/publish-lumina-loss-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed source changes to pinned baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = cc56d6c2123cebc7ff3605c662c4c33e860a5830
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          encoded = ''''''
          changes = json.loads(gzip.decompress(base64.b64decode(encoded)))
          for name, edits, text in changes:
              path = Path(name)
              if edits is None:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text)
              else:
                  lines = path.read_text().splitlines(keepends=True)
                  for first, last, replacement in reversed(edits):
                      lines[first:last] = replacement.splitlines(keepends=True)
                  path.write_text(''.join(lines))
          PY
          git diff --check
      - name: Build and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run validate:dist
      - name: Publish source and immutable theme build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE-LuminaPlus src
          git commit -m 'fix: align probe loss buckets, weights and colors with LuminaPlus v1.2.24'
          git push origin HEAD:custom
          cp README.md /tmp/custom-readme.md
          cd dist
          git init -q
          git checkout -q -b theme-custom
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'build: LuminaPlus v1.2.24 loss alignment'
          DIST_SHA=$(git rev-parse HEAD)
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" theme-custom:theme-custom
          echo "https://github.com/${GITHUB_REPOSITORY}/tree/${DIST_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "$DIST_SHA" > /tmp/theme-sha
          cd ..
          git fetch origin main --depth=1
          git checkout -B main origin/main
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          original = path.read_text()
          custom = Path('/tmp/custom-readme.md').read_text()
          start = custom.index('## 本 fork 的使用说明')
          end = custom.index('## 预览', start)
          section = custom[start:end]
          sha = Path('/tmp/theme-sha').read_text().strip()
          section += '### 本次修复的固定版本\n\n```text\nhttps://github.com/lll33lll/CFSM-Glassmorphism/tree/' + sha + '\n```\n\n'
          start = original.index('## 本 fork 的使用说明')
          end = original.index('## 预览', start)
          original = original[:start] + section + original[end:]
          first = original.index('**丢包的柱子过一会儿就没了？**')
          last = original.index('**详情页历史最长只有 24 小时？**', first)
          original = original[:first] + '**柱子和丢包率现在与 LuminaPlus 一样吗？** 统计算法、时间窗口、样本权重和颜色已按 v1.2.24 对齐。不同主题和浏览器的本地缓冲互相独立，刚切换时仍可能因可用样本不同而有差异；丢包数字为柱带窗口加权值，不是最新单次探测。\n\n**黄色 / 橙色代表什么？** 丢包使用连续 HSL 渐变，绿→黄绿→黄→橙→红；离线整桶两排均标红，但离线状态标记不作为 100% 测量值混入平均。\n\n' + original[last:]
          path.write_text(original)
          PY
          git add README.md
          git commit -m "docs: fixed loss-aligned theme ${DIST_SHA}"
          git push origin HEAD:main
