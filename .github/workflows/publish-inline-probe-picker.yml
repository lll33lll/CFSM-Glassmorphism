name: Publish inline probe picker
on:
  push:
    branches: [fix/inline-probe-picker-20261121]
    paths: [.github/workflows/publish-inline-probe-picker.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed interaction changes
        run: |
          test "$(git rev-parse HEAD)" = 3084ff29a2f48325e6638735dfe605f1bd3287e6
          git fetch origin '${{ github.sha }}' --depth=1
          git show '${{ github.sha }}:src/components/dashboard/ProbeBars.vue' > src/components/dashboard/ProbeBars.vue
          git show '${{ github.sha }}:scripts/apply-inline-probe-picker.py' > /tmp/apply-inline-probe-picker.py
          echo '8072cced6eaa79064954d8607964aa86a9146843b729b0462b0a278cbcfe8dd3  src/components/dashboard/ProbeBars.vue' | sha256sum --check
          python3 /tmp/apply-inline-probe-picker.py
          git diff --check
      - name: Build and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run validate:dist
      - name: Publish source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/components/dashboard/ServerCard.vue src/components/dashboard/ProbeBars.vue
          git commit -m 'feat: inline touch bucket tooltip instead of probe history modal'
          git push origin HEAD:custom
      - name: Publish theme-custom
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b theme-custom
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'build: inline probe picker'
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" theme-custom:theme-custom
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "https://github.com/${GITHUB_REPOSITORY}/tree/$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Update fixed version README
        env:
          BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('20 根柱子和点击打开曲线；列表同样显示三网。', '20 根柱子；点柱子就地显示该格时间范围与数值，手指滑动切换、松手后保留 2.5 秒，不再弹曲线卡片；列表同样显示三网。')
          prefix = 'https://github.com/lll33lll/CFSM-Glassmorphism/tree/'
          s = re.sub(re.escape(prefix) + r'[0-9a-f]{40}', prefix + os.environ['BUILD_SHA'], s)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: inline-picker fixed theme ${BUILD_SHA}"
          git push origin HEAD:main
