name: Update fixed loss-aligned theme documentation
on:
  push:
    branches: [fix/lumina-loss-20261120]
    paths: [.github/workflows/publish-lumina-loss-verified.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Update README only
        run: |
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path
          url = 'https://raw.githubusercontent.com/lll33lll/CFSM-Glassmorphism/3084ff29a2f48325e6638735dfe605f1bd3287e6/README.md'
          custom = urllib.request.urlopen(url, timeout=40).read().decode()
          path = Path('README.md')
          original = path.read_text()
          start = custom.index('## 本 fork 的使用说明')
          end = custom.index('## 预览', start)
          section = custom[start:end]
          sha = '30e9551d0eee6a3c36a2ed26aaafb30437c0568a'
          section += '### 本次修复的固定版本\n\n```text\nhttps://github.com/lll33lll/CFSM-Glassmorphism/tree/' + sha + '\n```\n\n'
          start = original.index('## 本 fork 的使用说明')
          end = original.index('## 预览', start)
          original = original[:start] + section + original[end:]
          first = original.index('**丢包的柱子过一会儿就没了？**')
          last = original.index('**详情页历史最长只有 24 小时？**', first)
          original = original[:first] + '**柱子和丢包率现在与 LuminaPlus 一样吗？** 统计算法、时间窗口、样本权重和颜色已按 v1.2.24 对齐。不同主题和浏览器的本地缓冲互相独立，刚切换时仍可能因可用样本不同而有差异；丢包数字为柱带窗口加权值，不是最新单次探测。\n\n**黄色 / 橙色代表什么？** 丢包使用连续 HSL 渐变，绿→黄绿→黄→橙→红；离线整桶两排均标红，但离线状态标记不作为 100% 测量值混入平均。\n\n' + original[last:]
          original = original.replace('按其 `utils/metricTone.ts` 与 `components/node/nodeCardShared.ts` 的口径实现。', '丢包合并、权重与分桶算法按 v1.2.24（391dc27）移植，核心文件 `src/domain/probe-lumina.ts`，许可见 `LICENSE-LuminaPlus`。')
          path.write_text(original)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: fixed loss-aligned theme 30e9551d and corrected LuminaPlus rules'
          git push origin HEAD:main
