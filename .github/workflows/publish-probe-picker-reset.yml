name: Publish probe picker reset fix
on:
  push:
    branches: [fix/probe-picker-reset-20261121]
    paths: [.github/workflows/publish-probe-picker-reset.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed UI fix
        run: |
          test "$(git rev-parse HEAD)" = 281bc30d5c3861ec8acf36664b124f15ea5b7016
          git fetch origin '${{ github.sha }}' --depth=1
          git show '${{ github.sha }}:src/components/dashboard/ProbeBars.vue' > src/components/dashboard/ProbeBars.vue
          echo '749f02b292fcc198b61e00877f8bc99f1c58909175e45c8b54282c0c1202a0bd  src/components/dashboard/ProbeBars.vue' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/dashboard/ServerCard.vue')
          s = p.read_text()
          hint = '            <span class="node-probe__hint">点柱子查看</span>\n'
          assert s.count(hint) == 2
          p.write_text(s.replace(hint, ''))
          p = Path('README.md')
          s = p.read_text()
          note = '- **点按状态修复**：取消触屏卡片的悬停闪动；气泡独立渲染，关闭时柱子的缩放、亮度、透明度同步恢复；已去掉「点柱子查看」提示文字。\n\n'
          p.write_text(s.replace('## 预览', note + '## 预览', 1))
          PY
          git diff --check
      - name: Build and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          bun run validate:dist
      - name: Publish source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/components/dashboard/ServerCard.vue src/components/dashboard/ProbeBars.vue
          git commit -m 'fix: prevent touch card flash and restore probe bars after tooltip closes'
          git push origin HEAD:custom
      - name: Publish theme-custom
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b theme-custom
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'build: probe picker flash and reset fix'
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" theme-custom:theme-custom
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "https://github.com/${GITHUB_REPOSITORY}/tree/$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Update fixed-version documentation
        env:
          BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          prefix = 'https://github.com/lll33lll/CFSM-Glassmorphism/tree/'
          s = re.sub(re.escape(prefix) + r'[0-9a-f]{40}', prefix + os.environ['BUILD_SHA'], s)
          note = '- **点按状态修复**：取消触屏卡片的悬停闪动；气泡独立渲染，关闭时柱子的缩放、亮度、透明度同步恢复；已去掉「点柱子查看」提示文字。\n\n'
          s = s.replace('## 预览', note + '## 预览', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: fixed probe-picker-reset theme ${BUILD_SHA}"
          git push origin HEAD:main
