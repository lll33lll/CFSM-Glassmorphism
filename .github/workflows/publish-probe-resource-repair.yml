name: Publish probe history and resource chart repair
on:
  push:
    branches: [fix/probe-history-resource-charts-20261121]
    paths: [.github/workflows/publish-probe-resource-repair.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install build dependencies
        run: bun install --frozen-lockfile
      - name: Apply reviewed source repair
        run: |
          test "$(git rev-parse HEAD)" = e1be6a084763e02559a72a462308d311561e8ed6
          git fetch origin '${{ github.sha }}' --depth=1
          git show '${{ github.sha }}:scripts/apply-probe-resource-repair.py' > /tmp/apply-probe-resource-repair.py
          echo 'b0de3d294f230c101d06093daaba1ec2912171055d321b732279d6260df0d073  /tmp/apply-probe-resource-repair.py' | sha256sum --check
          python3 /tmp/apply-probe-resource-repair.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          note = '- **历史与图表修复**：同一浏览器只读接续 LuminaPlus 已有真实探测样本，不修改其缓存；旧到达时间缓存不再复用，实时记录使用 sample.ts、过滤旧帧、重连不倒退，柱带按整分钟推进。资源图改用真实时间轴与实线，正常聚合间隔不再人为断线；真实空值与长时间断档仍保留。\n\n'
          p.write_text(s.replace('## 预览', note + '## 预览', 1))
          PY
      - name: Check and build
        run: |
          bun run typecheck
          bunx eslint src/services/cfsm/adapters.ts src/services/cfsm/probe-live.ts src/stores/servers.ts src/stores/server-detail.ts src/views/HomeView.vue src/domain/server-detail.ts src/domain/detail-chart-options.ts --max-warnings=0
          bun run build
          bun run validate:dist
      - name: Publish source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src
          git commit -m 'fix: align real probe history and remove false resource chart gaps'
          git push origin HEAD:custom
      - name: Publish theme-custom
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b theme-custom
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'build: probe continuity and resource chart repair'
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" theme-custom:theme-custom
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update immutable theme documentation
        env:
          BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          prefix = 'https://github.com/lll33lll/CFSM-Glassmorphism/tree/'
          s = re.sub(re.escape(prefix) + r'[0-9a-f]{40}', prefix + os.environ['BUILD_SHA'], s)
          s = s.replace('不同主题和浏览器的本地缓冲互相独立，刚切换时仍可能因可用样本不同而有差异', '同一浏览器支持只读接续 LuminaPlus 的已有真实样本；不同浏览器仍独立')
          note = '- **历史与图表修复**：同一浏览器只读接续 LuminaPlus 已有真实探测样本，不修改其缓存；旧到达时间缓存不再复用，实时记录使用 sample.ts、过滤旧帧、重连不倒退，柱带按整分钟推进。资源图改用真实时间轴与实线，正常聚合间隔不再人为断线；真实空值与长时间断档仍保留。\n\n'
          s = s.replace('## 预览', note + '## 预览', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: repaired probe/resource theme ${BUILD_SHA}"
          git push origin HEAD:main
