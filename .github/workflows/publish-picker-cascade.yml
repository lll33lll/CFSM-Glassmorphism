name: Publish touch picker cascade fix
on:
  push:
    branches: [fix/probe-picker-reset-20261121]
    paths: [.github/workflows/publish-picker-cascade.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Fix touch style cascade
        run: |
          test "$(git rev-parse HEAD)" = b1212cacf59310b104a7e50a7ed528b8964f656b
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/dashboard/ProbeBars.vue')
          s = p.read_text()
          edits = [
            (':global(.node-card:hover)', ':global(.node-card.node-card:hover)'),
            ('background: var(--node-card-surface, var(--card-surface));', 'background: var(--node-card-surface, var(--card-surface)) !important;'),
            ('box-shadow: var(--node-card-shadow, var(--card-surface-shadow));', 'box-shadow: var(--node-card-shadow, var(--card-surface-shadow)) !important;')
          ]
          for old, new in edits:
              assert s.count(old) == 1
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
      - name: Build and validate
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run validate:dist
      - name: Publish source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/dashboard/ProbeBars.vue
          git commit -m 'fix: enforce coarse-pointer card paint priority independently of CSS bundle order'
          git push origin HEAD:custom
      - name: Publish theme-custom
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b theme-custom
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'build: stable touch picker reset'
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" theme-custom:theme-custom
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update fixed theme URL
        env:
          BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          prefix = 'https://github.com/lll33lll/CFSM-Glassmorphism/tree/'
          s = re.sub(re.escape(prefix) + r'[0-9a-f]{40}', prefix + os.environ['BUILD_SHA'], s)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: stable picker-reset theme ${BUILD_SHA}"
          git push origin HEAD:main
