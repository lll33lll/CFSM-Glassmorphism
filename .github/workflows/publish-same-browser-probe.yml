name: Publish same-browser probe baseline fix
on:
  push:
    branches: [fix/same-browser-probe-baseline-20261121]
    paths: [.github/workflows/publish-same-browser-probe.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply reviewed probe baseline fix
        run: |
          test "$(git rev-parse HEAD)" = 066f13be286a3a19e2841f35a8fec26bc350e0e2
          git fetch origin '${{ github.sha }}' --depth=1
          git show '${{ github.sha }}:scripts/apply-same-browser-probe.py' > /tmp/apply-same-browser-probe.py
          echo 'dd217f685a447661d494e728916248d0cd90781ae8220ad38594c8fb154121ee  /tmp/apply-same-browser-probe.py' | sha256sum --check
          python3 /tmp/apply-same-browser-probe.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          note = '- **同浏览器基线修复**：有新鲜 LuminaPlus 历史时，原样作为启动基线，不再叠加 Glassmorphism 旧缓存；样本权重只在真实输入改变时重算，绘图分钟与采样时刻分开处理，分钟边界后的新样本不再提前剔除。原主题缓存仍只读，真实丢包仍保留。\n\n'
          p.write_text(s.replace('## 预览', note + '## 预览', 1))
          PY
      - name: Build and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx eslint src/services/cfsm/probe-live.ts src/services/cfsm/glassmorphism-adapter.ts src/domain/probe-lumina.ts src/domain/probe-buckets.ts src/views/HomeView.vue --max-warnings=0
          bun run build
          bun run validate:dist
      - name: Publish source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src
          git commit -m 'fix: avoid mixed old probe samples and drifting measurement weights'
          git push origin HEAD:custom
      - name: Publish theme-custom
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b theme-custom
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'build: consistent probe baseline and measurement clock'
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" theme-custom:theme-custom
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Update immutable theme documentation
        env:
          BUILD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          prefix = 'https://github.com/lll33lll/CFSM-Glassmorphism/tree/'
          s = re.sub(re.escape(prefix) + r'[0-9a-f]{40}', prefix + os.environ['BUILD_SHA'], s)
          note = '- **同浏览器基线修复**：有新鲜 LuminaPlus 历史时，原样作为启动基线，不再叠加 Glassmorphism 旧缓存；样本权重只在真实输入改变时重算，绘图分钟与采样时刻分开处理，分钟边界后的新样本不再提前剔除。原主题缓存仍只读，真实丢包仍保留。\n\n'
          p.write_text(s.replace('## 预览', note + '## 预览', 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: fixed same-browser probe theme ${BUILD_SHA}"
          git push origin HEAD:main
